batch_size: 128
eval_batch_size: 512
num_workers: 2
persistent_workers: true
pin_memory: true
root_dir: "data"
random_seed: 42
train_size: 45000
num_epochs: 50
num_classes: 10
channels: [32, 64, 128]
hidden: 256
dropout: 0.3 
lr: 0.001
weight_decay: 0.001
optimizer_name: "adam"
checkpoint_dir: "artifacts/checkpoints"
patience: 5
delta: 0
mlflow:
  tracking_uri: "sqlite:///mlflow.db"  # local SQLite store (file store is deprecated); or a server URL
  experiment_name: "visionforge-cifar10"
plot_path: "artifacts/evaluation"
preprocessing:
  image_size: 32
  mean: [0.4914, 0.4822, 0.4465]
  std: [0.2023, 0.1994, 0.2010]
serving:
  checkpoint_path: "artifacts/checkpoints/best.pth"
  device: "auto"  # "auto" uses CUDA when available, otherwise CPU
  top_k: 3
  max_upload_bytes: 5242880
  class_names: ["airplane", "automobile", "bird", "cat", "deer", "dog", "frog", "horse", "ship", "truck"]
scheduler_name: "cosine"
scheduler_params:
  T_max: 50
  eta_min: 0
